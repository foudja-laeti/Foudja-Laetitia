<!-- src/app/features/auth/forgot-password/forgot-password.html -->

<div class="forgot-password-container">
    <div class="forgot-password-card">
      <!-- Logo et Titre -->
      <div class="forgot-password-header">
        <div class="logo">
          <i class="fas fa-key"></i>
        </div>
        <h1>Mot de passe oublié</h1>
        <p>Entrez votre email pour réinitialiser votre mot de passe</p>
      </div>
  
      <!-- Message de succès -->
      <div class="alert alert-success" *ngIf="success">
        <i class="fas fa-check-circle"></i>
        {{ success }}
      </div>
  
      <!-- Message d'erreur -->
      <div class="alert alert-danger" *ngIf="error">
        <i class="fas fa-exclamation-circle"></i>
        {{ error }}
      </div>
  
      <!-- Formulaire -->
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <!-- Email -->
        <div class="form-group">
          <label for="email">
            <i class="fas fa-envelope"></i>
            Email
          </label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('email')"
            placeholder="exemple@school.com"
          />
          <div class="invalid-feedback" *ngIf="isFieldInvalid('email')">
            <span *ngIf="f['email'].errors?.['required']">L'email est requis</span>
            <span *ngIf="f['email'].errors?.['email']">Email invalide</span>
          </div>
        </div>
  
        <!-- Submit Button -->
        <button
          type="submit"
          class="btn btn-primary btn-block"
          [disabled]="loading"
        >
          <span *ngIf="!loading">Réinitialiser le mot de passe</span>
          <span *ngIf="loading">
            <i class="fas fa-spinner fa-spin"></i>
            Envoi en cours...
          </span>
        </button>
      </form>
  
      <!-- Retour à la connexion -->
      <div class="back-to-login">
        <a routerLink="/auth/login">
          <i class="fas fa-arrow-left"></i>
          Retour à la connexion
        </a>
      </div>
    </div>
  
    <!-- Footer -->
    <div class="forgot-password-footer">
      <p>&copy; 2025 Système de Gestion Scolaire. Tous droits réservés.</p>
    </div>
  </div>
